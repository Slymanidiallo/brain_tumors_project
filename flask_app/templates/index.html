<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brain Tumor Image Classifier</title>

    <!-- Image de fond injectée ici -->
    <style>
        body {
            background-image: url("{{ url_for('static', filename='cerv.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>

    <!-- Feuille de style principale -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="container">
        <h1>Brain Tumor Image Classifier</h1>

        <!-- Static image -->
        <img src="{{ url_for('static', filename='cancer.png') }}" alt="Brain tumor image" class="cancer-image" />

        <!-- Upload form -->
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="model">Select Model:</label>
                <select name="model" id="model" required>
                    <option value="pytorch">PyTorch</option>
                    <option value="tensorflow">TensorFlow</option>
                </select>
            </div>

            <div class="form-group">
                <label for="image">Upload an image:</label>
                <input type="file" name="image" id="image" accept="image/*" required />
            </div>

            <button type="submit">Classify</button>
        </form>

        <!-- Prediction display -->
        {% if prediction %}
        <div class="prediction">
            <p>Prediction: <span>{{ prediction }}</span></p>
            {% if probability %}
            <p>Probability: <span>{{ probability }}%</span></p>
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>
</html>
